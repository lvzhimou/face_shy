name: 诊断工程文件

# 临时诊断用：借助 Apple 官方 plutil 解析器定位 project.pbxproj 的解析失败原因。
# 定位完成后可删除本文件。

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 环境信息
        if: always()
        run: |
          echo "--- sw_vers ---"; sw_vers
          echo "--- xcodebuild ---"; xcodebuild -version
          echo "--- swift ---"; swift --version 2>/dev/null | head -2

      - name: xcodeproj 目录内容
        if: always()
        run: |
          echo "--- find FaceShy.xcodeproj ---"
          find FaceShy.xcodeproj -print
          echo "--- 权限/大小 ---"
          ls -la FaceShy.xcodeproj
          ls -la FaceShy.xcodeproj/project.pbxproj

      - name: 文件类型与首字节
        if: always()
        run: |
          file FaceShy.xcodeproj/project.pbxproj
          echo "--- 前 64 字节 ---"
          head -c 64 FaceShy.xcodeproj/project.pbxproj | od -c | head -6
          echo "--- 行尾统计 ---"
          echo "CRLF 行数: $(grep -c $'\r' FaceShy.xcodeproj/project.pbxproj || true)"
          echo "总行数   : $(wc -l < FaceShy.xcodeproj/project.pbxproj)"

      - name: plutil 校验 pbxproj（Apple 官方解析器）
        if: always()
        continue-on-error: true
        run: |
          echo "===== plutil -lint ====="
          plutil -lint FaceShy.xcodeproj/project.pbxproj; echo "exit=$?"

      - name: plutil 转 JSON（会打印精确的错误行）
        if: always()
        continue-on-error: true
        run: |
          echo "===== plutil -convert json ====="
          plutil -convert json -o /tmp/pbx.json FaceShy.xcodeproj/project.pbxproj; echo "exit=$?"
          if [ -f /tmp/pbx.json ]; then head -c 300 /tmp/pbx.json; echo; fi

      - name: 用 Ruby xcodeproj 库解析（第三方交叉验证）
        if: always()
        continue-on-error: true
        run: |
          echo "===== ruby xcodeproj ====="
          gem install xcodeproj --no-document >/dev/null 2>&1 || true
          ruby -e 'require "xcodeproj"; p = Xcodeproj::Project.open("FaceShy.xcodeproj"); puts "OK targets=#{p.targets.map(&:name)}"' ; echo "exit=$?"

      - name: 校验 xcscheme
        if: always()
        continue-on-error: true
        run: |
          echo "===== xcscheme ====="
          plutil -lint FaceShy.xcodeproj/xcshareddata/xcschemes/FaceShy.xcscheme; echo "exit=$?"
          head -20 FaceShy.xcodeproj/xcshareddata/xcschemes/FaceShy.xcscheme

      - name: 重试 xcodebuild -list
        if: always()
        continue-on-error: true
        run: |
          echo "===== xcodebuild -list ====="
          xcodebuild -project FaceShy.xcodeproj -list; echo "exit=$?"

      - name: 尝试 xcodebuild -list -json
        if: always()
        continue-on-error: true
        run: |
          echo "===== xcodebuild -list -json ====="
          xcodebuild -project FaceShy.xcodeproj -list -json; echo "exit=$?"
