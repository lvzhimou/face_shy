name: 构建未签名 IPA

# 说明：
#   · 推送到 main / master 后会自动构建（无需手动点）
#   · 也可以在 Actions 页面手动触发（手机浏览器登录 GitHub 也能点），并可自定义 Bundle Identifier
#   · 产物是「未签名 IPA」，用 Sideloadly / AltStore / 轻松签 等自签工具安装
#   · 构建成功后自动覆盖上传到 Release v1.0.0（附件名固定 FaceShy-unsigned.ipa，
#     所以「最新版直链」永远指向最近一次成功构建，手机端不需要电脑参与）
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle Identifier（默认 com.faceshy.app）
        required: false
        default: com.faceshy.app
      build_number:
        description: 构建号 / 版本号 build（留空则用 run number）
        required: false
        default: ''
  push:
    branches: [main, master]

# 上传 Release 附件需要 contents 写权限
permissions:
  contents: write

jobs:
  build-ipa:
    name: 编译并打包 IPA
    # macos-latest 始终指向最新稳定镜像（自带 Xcode），避免固定版本被退役导致构建突然失败
    # 如需固定，可改成 macos-14 或 macos-15
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示构建环境
        run: |
          echo "macOS:  $(sw_vers -productVersion)"
          echo "Xcode:  $(xcodebuild -version | head -1)"
          echo "Swift:  $(swift --version 2>/dev/null | head -1)"
          python3 --version 2>/dev/null || echo "python3 不可用"

      - name: 校验工程文件（快速失败）
        # 先做语法校验：pbxproj 出错时 xcodebuild 只会报
        # "JSON text did not start with array or object" + "project is damaged"，
        # 完全看不出真正原因，所以这里给出精确到行列的报错。
        run: |
          python3 tools/validate_pbxproj.py
          xcodebuild -project FaceShy.xcodeproj -list

      - name: 编译并打包未签名 IPA
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.faceshy.app' }}
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: 显示产物信息
        run: |
          ls -lh build/*.ipa
          echo "--- 包内结构（前 25 项）---"
          unzip -l build/FaceShy-unsigned.ipa | head -25

      - name: 校验 IPA 结构
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 tools/pack_ipa.py --verify build/FaceShy-unsigned.ipa
          else
            echo "python3 不可用，跳过校验（已在上一步列出包内结构）"
          fi

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: FaceShy-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 同步到 Release（手机可直接下载）
        # 电脑关机时，手机浏览器登录 GitHub -> Actions -> 点「Run workflow」即可重新构建，
        # 构建完成后 IPA 自动出现在 Releases 页，手机直接下载即可，
        # 再用手机端签名工具（轻松签 / ESign / 全能签）签名安装，全程不需要电脑。
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
        run: |
          IPA=build/FaceShy-unsigned.ipa
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPA" \
              --title "隐颜 FaceShy · 未签名 IPA" \
              --notes "自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，commit ${GITHUB_SHA::7}" \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "=== Release 当前附件 ==="
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes  更新于 \(.updatedAt)"'
